name: Release policy validation
on:
  pull_request:
    paths: ['.github/workflows/**', '.github/scripts/**', 'tests/release/**', 'docs/release-policy.md']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/scripts/**', 'tests/release/**', 'docs/release-policy.md']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: node --test tests/release/*.test.js
      - run: python -m unittest discover -s tests/release -p 'test_*.py'
