name: Owner-approved GHCR publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (never created or moved)
        required: true
        type: string
      sha:
        description: Full tested commit SHA on main
        required: true
        type: string
      latest:
        description: Also update the mutable latest image tag
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ghcr-publication
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.policy.outputs.sha }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: policy
        uses: actions/github-script@v7
        env:
          PUBLISH_ENABLED: ${{ vars.GHCR_PUBLISH_ENABLED }}
        with:
          script: |
            await require('./.github/scripts/release-policy').preflight({github, context, core});
  publish:
    needs: preflight
    environment: ghcr-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      # Recheck after approval: inputs, tag, CI and protection may have changed while waiting.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          PUBLISH_ENABLED: ${{ vars.GHCR_PUBLISH_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            await require('./.github/scripts/release-policy').preflight({github, context, core});
            const image = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            await require('./.github/scripts/registry-tags').requireAbsent(image,
              [context.payload.inputs.tag, `sha-${context.payload.inputs.sha}`],
              `${context.actor}:${process.env.GITHUB_TOKEN}`);
            core.exportVariable('RELEASE_IMAGE', `ghcr.io/${image}`);
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.RELEASE_IMAGE }}:${{ needs.preflight.outputs.tag }}
            ${{ env.RELEASE_IMAGE }}:sha-${{ needs.preflight.outputs.sha }}
            ${{ inputs.latest && format('{0}:latest', env.RELEASE_IMAGE) || '' }}
