name: Mark and close opted-in stale issues

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight

permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
    - name: Close opted-in stale issues
      uses: actions/stale@v8
      with:
        repo-token: ${{ github.token }}
        stale-issue-message: "This opted-in issue will be closed after three more days of inactivity. Respond or remove the stale-opt-in label to keep it open."
        close-issue-message: "This issue has been closed due to lack of response."
        only-issue-labels: "stale-opt-in"
        days-before-issue-stale: 7
        days-before-issue-close: 3
        stale-issue-label: "stale"
        exempt-issue-labels: "wontfix,bug"
        days-before-pr-stale: -1
        days-before-pr-close: -1
        remove-pr-stale-when-updated: false
