name: Container build validation
on:
  pull_request:
    paths: ['Dockerfile', 'requirements.txt', 'package*.json', '.github/workflows/docker-build-push.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', 'requirements.txt', 'package*.json', '.github/workflows/docker-build-push.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
