name: Learning engine validation
on:
  pull_request:
  push:
    branches: [feature/learning-engine-v2]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_CA_BUNDLE: .e2e-cache/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
      - name: Prepare trusted CA bundle for Compose
        run: |
          mkdir -p .e2e-cache
          cp /etc/ssl/certs/ca-certificates.crt "$TEST_CA_BUNDLE"
      - name: Start isolated integration stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait ai
      - name: Unit and SQLite regression tests
        run: docker compose -f docker-compose.test.yml exec -T ai sh -c 'node --test tests/*.test.js'
      - name: Cloud setup safety contracts
        run: |
          docker compose -f docker-compose.test.yml exec -T paperless mkdir -p /tmp/learning-validation/tests
          docker compose -f docker-compose.test.yml cp tests/e2e paperless:/tmp/learning-validation/tests/
          docker compose -f docker-compose.test.yml exec -T paperless python3 -B -m unittest discover -s /tmp/learning-validation/tests/e2e -p 'test_*.py'
      - name: Lint new test infrastructure
        run: docker compose -f docker-compose.test.yml exec -T ai sh -c 'npx --no-install eslint tests/e2e/*.js tests/learning*.test.js services/learning*.js routes/learning.js routes/manualLearning.js public/js/learning.js'
      - name: Real Paperless integration tests
        run: docker compose -f docker-compose.test.yml run --rm runner
      - name: Detect edits made while the app was stopped
        run: python3 -B tests/e2e/restart-check.py
      - name: Browser review and responsive layout checks
        run: docker compose -f docker-compose.test.yml --profile extended run --build --name paperless-ai-e2e-browser browser
      - name: Collect browser screenshots
        if: always()
        run: docker cp paperless-ai-e2e-browser:/artifacts ./browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-browser-screenshots
          path: browser-artifacts/*.png
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=100
      - name: Remove disposable stack
        if: always()
        run: docker compose -f docker-compose.test.yml --profile extended down -v --remove-orphans
