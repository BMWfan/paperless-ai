name: Learning engine validation
on:
  pull_request:
  push:
    branches: [feature/learning-engine-v2]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Compose mounts the CA as a BuildKit secret. Bake requires a separate
      # filesystem entitlement for this system path on current hosted runners.
      COMPOSE_BAKE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit and SQLite regression tests
        run: node --test tests/*.test.js
      - name: Lint new test infrastructure
        run: npx eslint tests/e2e/*.js tests/learning-v2.test.js services/learning*.js routes/learning.js public/js/learning.js
      - name: Start isolated integration stack
        run: docker compose -f docker-compose.test.yml up -d --build ai
      - name: Real Paperless integration tests
        run: docker compose -f docker-compose.test.yml run --rm runner
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=100
      - name: Remove disposable stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
