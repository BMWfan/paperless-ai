name: Learning engine validation
on:
  pull_request:
  push:
    branches: [main, feature/upstream-v4-learning-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-v4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        initial: ['3.5.1', '3.4.2']
    env:
      COMPOSE_PROJECT_NAME: paperless-ai-v4-e2e
      TEST_PAPERLESS_VERSION: ${{ matrix.initial }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Start unchanged official ngx and the current fork
        run: docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 600 ai
      - name: Native API, typed extraction, provenance and current-number patterns
        run: docker compose -f docker-compose.test.yml run --rm --no-deps runner
      - name: Setup security HTTP regression gates (isolated fixture)
        run: docker compose -f docker-compose.test.yml run --rm --no-deps runner env SETUP_SECURITY_HTTP_FIXTURE=1 node --test /fixture/setup-security.test.mjs
      - name: Verify real app restart preserves learning without inference
        run: |
          docker compose -f docker-compose.test.yml restart ai
          docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 120 --no-deps ai
          docker compose -f docker-compose.test.yml run --rm --no-deps runner node /fixture/native.mjs restart
      - name: Upgrade official ngx 3.4.2 to 3.5.1 using only this fixture's volumes
        if: matrix.initial == '3.4.2'
        env:
          TEST_PAPERLESS_VERSION: '3.5.1'
        run: |
          docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 600 paperless
          docker compose -f docker-compose.test.yml restart ai
          docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 120 --no-deps ai
          docker compose -f docker-compose.test.yml run --rm --no-deps runner
      - name: Synthetic stack diagnostics on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=100
      - name: Remove only this disposable stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
