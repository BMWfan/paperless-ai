name: OpenAI bounded connection smoke check
# SPEC #43: one owner-authorized synthetic question, at most 16 output tokens.
on:
  workflow_dispatch:
  push:
    branches: [feature/upstream-v4-learning-v2]
    paths: ['.github/workflows/openai-credential-check.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify test credential and model visibility without inference
        env:
          OPENAI_TEST_API_KEY: ${{ secrets.OPENAI_TEST_API_KEY }}
        shell: bash
        run: |
          set +x
          if [[ -z "$OPENAI_TEST_API_KEY" ]]; then
            echo 'secret_present=false'
            exit 1
          fi
          echo 'secret_present=true'
          set +e
          status=$(printf 'Authorization: Bearer %s\n' "$OPENAI_TEST_API_KEY" | curl --silent --max-time 20 --proto '=https' --header @- --output /dev/null --write-out '%{http_code}' https://api.openai.com/v1/models/gpt-4.1-mini)
          result=$?
          set -e
          printf 'http_status=%s\ncurl_exit=%s\n' "$status" "$result"
          [[ "$result" == 0 && "$status" == 200 ]]
      - name: Ask one fixed synthetic question
        id: question
        env:
          OPENAI_TEST_API_KEY: ${{ secrets.OPENAI_TEST_API_KEY }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          payload = json.dumps({
              "model": "gpt-4.1-mini",
              "messages": [{"role": "user", "content": "Was ist 2 plus 2? Antworte nur mit der Zahl."}],
              "max_completion_tokens": 16,
              "temperature": 0
          }).encode()
          request = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions", data=payload,
              headers={"Authorization": "Bearer " + os.environ["OPENAI_TEST_API_KEY"], "Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read(1048576))
                  print("inference_http_status=" + str(response.status))
          except urllib.error.HTTPError as error:
              print("inference_http_status=" + str(error.code))
              raise SystemExit(1)
          except Exception:
              print("inference_transport_error=true")
              raise SystemExit(1)
          answer = result["choices"][0]["message"]["content"].strip()
          if answer != "4":
              print("expected_answer=false")
              raise SystemExit(1)
          usage = result.get("usage", {})
          print("answer=" + answer)
          print("usage=" + json.dumps(usage))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("answer=" + answer + "\n")
              for key in ("prompt_tokens", "completion_tokens", "total_tokens"):
                  output.write(key + "=" + str(int(usage[key])) + "\n")
      - name: "Model replied ${{ steps.question.outputs.answer }}; tokens ${{ steps.question.outputs.prompt_tokens }} input, ${{ steps.question.outputs.completion_tokens }} output, ${{ steps.question.outputs.total_tokens }} total"
        run: echo 'One synthetic inference completed. No classification-quality or billing claim.'
