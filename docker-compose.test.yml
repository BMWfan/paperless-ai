# Disposable upstream4 integration counterpart. Never connect this stack to production.
name: paperless-ai-v4-e2e
x-app: &app
  image: paperless-ai-v4-e2e:local
  build:
    context: .
    dockerfile: Dockerfile
  networks: [fixture]
services:
  db:
    image: postgres:16.6-alpine
    networks: [fixture]
    mem_limit: 256m
    environment:
      POSTGRES_DB: paperless_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: isolated-test-only
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U test -d paperless_test']
      interval: 5s
      retries: 30
  redis:
    image: redis:7.4.2-alpine
    networks: [fixture]
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 30
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:${TEST_PAPERLESS_VERSION:-3.5.1}
    networks: [fixture]
    mem_limit: 2g
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless_test
      PAPERLESS_DBUSER: test
      PAPERLESS_DBPASS: isolated-test-only
      PAPERLESS_ADMIN_USER: test
      PAPERLESS_ADMIN_PASSWORD: isolated-test-only
      PAPERLESS_SECRET_KEY: isolated-v4-disposable-environment-only
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_THREADS_PER_WORKER: 1
      PAPERLESS_CONSUMER_POLLING: 1
      PAPERLESS_URL: http://paperless:8000
      PAPERLESS_ALLOWED_HOSTS: paperless,localhost,127.0.0.1
      PAPERLESS_AI_ENABLED: 'false'
    volumes:
      - documents:/usr/src/paperless/media
      - paperless-data:/usr/src/paperless/data
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/accounts/login/]
      interval: 5s
      start_period: 60s
      retries: 60
  mock-ai:
    image: node:22-bookworm-slim
    networks: [fixture]
    mem_limit: 128m
    command: [node, /fixture/mock.mjs]
    volumes: [./tests/v4:/fixture:ro]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:11434/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 5s
      retries: 30
  init:
    <<: *app
    mem_limit: 512m
    command: [node, /fixture/init.mjs]
    depends_on:
      paperless: {condition: service_healthy}
      mock-ai: {condition: service_healthy}
    volumes:
      - ./tests/v4:/fixture:ro
      - ai-data:/app/data
      - fixture-state:/fixtures
  ai:
    <<: *app
    mem_limit: 1g
    depends_on:
      init: {condition: service_completed_successfully}
    volumes: [ai-data:/app/data]
    ports: ['127.0.0.1:${TEST_AI_PORT:-3300}:3000']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 5s
      start_period: 20s
      retries: 60
  runner:
    <<: *app
    mem_limit: 512m
    command: [node, /fixture/native.mjs]
    depends_on:
      ai: {condition: service_healthy}
    environment:
      EXPECTED_PAPERLESS_VERSION: ${TEST_PAPERLESS_VERSION:-3.5.1}
    volumes:
      - ./tests/v4:/fixture:ro
      - fixture-state:/fixtures
networks:
  fixture:
    internal: true
volumes:
  database:
  documents:
  paperless-data:
  ai-data:
  fixture-state:
