# Explicit opt-in; always use a separate disposable project name.
services:
  paperless:
    environment:
      PAPERLESS_AI_ENABLED: 'true'
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_MODEL: qwen2.5:0.5b
      PAPERLESS_AI_LLM_ENDPOINT: http://native-model:11434
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: all-minilm:22m
      PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: http://native-model:11434
      PAPERLESS_AI_LLM_CONTEXT_SIZE: '4096'
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: '240'
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: en
    depends_on:
      native-model: {condition: service_healthy}
  native-model:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile.native-model
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    mem_limit: 3g
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      retries: 30
  native-check:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
      secrets: [proxy_ca]
    command: [node, --test, tests/e2e/native-ai.test.js]
    environment:
      NO_PROXY: paperless,ai,native-model,localhost,127.0.0.1
      no_proxy: paperless,ai,native-model,localhost,127.0.0.1
    volumes: ['ai-data:/app/data']
    depends_on:
      ai: {condition: service_healthy}
